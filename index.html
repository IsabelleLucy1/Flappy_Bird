<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Flappy Bird</title>
        <link rel="stylesheet" href="flappybird.css">
        <script src ="flappybird.js"></script>
    </head>

    <body>
        <div id="game-container">
            <canvas id="board"></canvas>
            <div id="difficulty-buttons" aria-label="Choose game difficulty" hidden>
                <button type="button" data-mode="Easy" data-interval="2000">
                    <span>Easy</span>
                    <small>2 sec</small>
                </button>
                <button type="button" data-mode="Normal" data-interval="1500">
                    <span>Normal</span>
                    <small>1.5 sec</small>
                </button>
                <button type="button" data-mode="Hard" data-interval="1000">
                    <span>Hard</span>
                    <small>1 sec</small>
                </button>
            </div>
        </div>
    </body>


</html>
